<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 学习知识图谱</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.1/dist/index.css">
</head>
<body>
  <header>
    <h1>🧠 LLM 学习知识图谱</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索知识点 / 标签…" autocomplete="off">
      <span id="stats" class="stats"></span>
      <span id="assistant-entry" class="ai-entry"></span>
      <span id="models-entry" class="ai-entry"></span>
      <div id="auth-area"></div>
    </div>
  </header>

  <div id="filter-bar">
    <div class="filter-row">
      <div class="mode-switch" title="怎么看这张图：先看大纲再一层层展开；随便逛用力导向；看技术栈分层；新手按路线学">
        <button id="mode-focus" class="mode-btn" title="首页推荐：先只看几个最重要的「大节点」，点一下展开下一层，再点一下收起——知识点再多也不乱">大纲</button>
        <button id="mode-force" class="mode-btn" title="所有知识点自由排布，连线 = 有关联，适合随便逛">力导向</button>
        <button id="mode-layer" class="mode-btn" title="按技术栈从下往上摞：底下是地基（算法），中间是大模型本身，上面是搭应用的技术，顶上是产品方案">分层</button>
        <button id="mode-route" class="mode-btn" title="像课程表一样按 1→2→3 排好学习顺序，最适合不知道从哪开始的新手">路线</button>
      </div>
      <div class="mode-switch" title="节点颜色代表什么（可切换）">
        <button id="color-category" class="mode-btn" title="颜色 = 知识领域（Agent/大模型应用/NLP/深度学习）">按分类</button>
        <button id="color-layer" class="mode-btn" title="颜色 = 技术栈层次（算法底层→业务应用）">按层次</button>
        <button id="color-mastery" class="mode-btn" title="颜色 = 我自己的掌握程度（登录标注后生效，未学=灰）">按掌握度</button>
      </div>
      <div id="diff-bar" title="按难度筛选：新手建议先看入门+进阶，跳过深入"></div>
      <span class="filter-spacer"></span>
      <a id="btn-offline-pack" class="btn small" href="/api/knowledge/offline" download title="下载一个能双击打开的单文件网页（带上全部知识点），没网也能看">⬇ 离线包</a>
      <button id="btn-collapse-all" class="btn small hidden" title="把展开的层级全部收起，回到只看第一层">一键收起</button>
      <button id="btn-help" class="btn small" title="用大白话解释这张图怎么用">❓ 使用说明</button>
    </div>
    <div id="route-bar" class="hidden"></div>
    <div id="tag-bar"></div>
    <div id="hot-bar" class="hidden"></div>
  </div>

  <main>
    <div id="graph"></div>
    <aside id="panel" class="empty">
      <div class="empty-hint">
        <div class="empty-icon">👆</div>
        <p>点击左侧节点开始学习</p>
        <p class="muted">不知道从哪学起？切到上方「路线」视图，从「① 打底线」开始</p>
      </div>
    </aside>
  </main>

  <footer>
    知识点存于 MySQL（<code>graph/build.mjs</code> 从 <code>notes/</code> 同步入库，gzip 压缩下发） ·
    构建时间：<span id="built-at">-</span> ·
    学习进度存于数据库（<code>npm start</code> 启动服务后登录可标注）
  </footer>

  <!-- 放大阅读视图（全屏查看笔记） -->
  <div id="reader-overlay" class="reader-overlay hidden">
    <div class="reader-card">
      <div class="reader-head">
        <span id="reader-node-title">笔记</span>
        <div class="reader-tools">
          <button id="reader-font-minus" class="btn small" title="缩小字号">A−</button>
          <button id="reader-font-plus" class="btn small" title="放大字号">A＋</button>
          <button id="reader-close" class="icon-btn" title="关闭（Esc）">✕</button>
        </div>
      </div>
      <div id="reader-body"></div>
    </div>
  </div>

  <!-- AI 全局助手抽屉（登录后可用：共享会话 + 流式对话 + 沉淀知识点） -->
  <div id="assistant-drawer" class="ai-drawer hidden">
    <div class="ai-drawer-head">
      <span class="ai-drawer-title">💬 全局助手</span>
      <div class="ai-drawer-tools">
        <select id="ai-model-select" title="对话使用的模型"></select>
        <button id="ai-new-chat" class="btn small">＋ 新会话</button>
        <button id="ai-toggle-sessions" class="icon-btn" title="显示/隐藏会话列表">☰</button>
        <button id="ai-close" class="icon-btn" title="关闭">✕</button>
      </div>
    </div>
    <div class="ai-drawer-body">
      <aside id="ai-sessions" class="ai-sessions">
        <div id="ai-session-list"></div>
      </aside>
      <section class="ai-chat">
        <div id="ai-messages" class="ai-messages">
          <div class="ai-empty-hint">
            <div style="font-size:28px">💬</div>
            <p>向 AI 助手提问，回答可一键沉淀为知识点</p>
            <p class="muted">会话全员共享 · 上下文自动携带最近 20 条</p>
          </div>
        </div>
        <div class="ai-input-row">
          <textarea id="ai-input" rows="1" placeholder="向助手提问…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="ai-send" class="btn primary">发送</button>
        </div>
      </section>
    </div>
  </div>

  <!-- 模型管理 -->
  <div id="models-modal" class="modal-mask z-top hidden">
    <div class="modal modal-lg">
      <div class="modal-head">
        <span>⚙ LLM 模型管理</span>
        <button id="models-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <div id="models-body"></div>
    </div>
  </div>

  <!-- 知识点沉淀（管理员：AI 对比预览；普通用户：填表单提交审核） -->
  <div id="know-modal" class="modal-mask z-top hidden">
    <div class="modal modal-lg">
      <div class="modal-head">
        <span>✨ 沉淀为知识点</span>
        <button id="know-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <div id="know-body"></div>
    </div>
  </div>

  <!-- 划词注释（选中正文 → 浮窗解答 → 存为带下划线的注释） -->
  <div id="anno-modal" class="modal-mask z-top hidden">
    <div class="modal modal-lg">
      <div class="modal-head">
        <span>💡 划词解答 · 注释</span>
        <button id="anno-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <div id="anno-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Vue UI Shell：承载登录/注册、个人中心、足迹、收藏、沉淀中心、使用说明、程度/笔记悬浮操作 -->
  <div id="ui-shell"></div>

  <!-- 知识数据引导：拉取 gzip bundle（IndexedDB 缓存秒开）后按序加载其余脚本 -->
  <script src="js/boot.js"></script>
</body>
</html>
