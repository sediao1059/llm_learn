<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 学习知识图谱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🧠 LLM 学习知识图谱</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索知识点 / 标签…" autocomplete="off">
      <span id="stats" class="stats"></span>
      <div id="auth-area"></div>
    </div>
  </header>

  <div id="filter-bar">
    <div class="mode-switch" title="图谱布局模式">
      <button id="mode-force" class="mode-btn">力导向</button>
      <button id="mode-layer" class="mode-btn">分层</button>
    </div>
    <div id="tag-bar"></div>
  </div>

  <main>
    <div id="graph"></div>
    <aside id="panel" class="empty">
      <div class="empty-hint">
        <div class="empty-icon">👆</div>
        <p>点击左侧节点开始学习</p>
        <p class="muted">节点可拖拽 · 滚轮缩放 · 顶部可搜索</p>
      </div>
    </aside>
  </main>

  <footer>
    数据由 <code>graph/build.mjs</code> 从 <code>notes/</code> 自动生成 ·
    构建时间：<span id="built-at">-</span> ·
    学习进度存于本地 SQLite（<code>npm start</code> 启动服务后登录可标注）
  </footer>

  <!-- 登录 / 注册弹窗 -->
  <div id="auth-modal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <span id="auth-title">登录</span>
        <button id="auth-close" class="icon-btn" title="关闭">✕</button>
      </div>
      <form id="auth-form">
        <label>用户名<input id="auth-username" autocomplete="username" maxlength="20" required></label>
        <label>密码<input id="auth-password" type="password" autocomplete="current-password" minlength="4" maxlength="64" required></label>
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" id="auth-submit" class="btn primary">登录</button>
        <button type="button" id="auth-switch" class="btn link">没有账号？注册一个</button>
      </form>
    </div>
  </div>

  <!-- 放大阅读视图（全屏查看笔记） -->
  <div id="reader-overlay" class="reader-overlay hidden">
    <div class="reader-card">
      <div class="reader-head">
        <span id="reader-node-title">笔记</span>
        <div class="reader-tools">
          <button id="reader-font-minus" class="btn small" title="缩小字号">A−</button>
          <button id="reader-font-plus" class="btn small" title="放大字号">A＋</button>
          <button id="reader-close" class="icon-btn" title="关闭（Esc）">✕</button>
        </div>
      </div>
      <div id="reader-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
