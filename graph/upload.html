<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传知识 · LLM 学习知识图谱</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.1/dist/index.css">
  <style>
    body { background: #f6f6f6; }
    .page-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e5e6eb; flex-wrap: wrap; gap: 10px; }
    .page-head h1 { font-size: 17px; margin: 0; }
    .head-right { display: flex; align-items: center; gap: 8px; }
    .upload-cols { display: flex; gap: 20px; align-items: flex-start; padding: 18px 20px 40px; max-width: 1280px; margin: 0 auto; }
    .upload-main { flex: 1; min-width: 0; }
    .upload-side { width: 320px; flex-shrink: 0; }
    .up-card { border: 1px solid #e5e6eb; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: #fafafa; }
    .up-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hm-grid { display: flex; gap: 3px; overflow-x: auto; padding: 2px 0; margin-top: 6px; }
    .hm-col { display: flex; flex-direction: column; gap: 3px; }
    .hm-cell { width: 13px; height: 13px; border-radius: 3px; background: #ebedf0; }
    .hm-cell.lv1 { background: #9be3b0; } .hm-cell.lv2 { background: #4ac97d; }
    .hm-cell.lv3 { background: #1fa45e; } .hm-cell.lv4 { background: #127c46; }
    @media (max-width: 900px) { .upload-cols { flex-direction: column; } .upload-side { width: 100%; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-head">
      <h1>📤 上传知识</h1>
      <div class="head-right">
        <el-button size="small" @click="goHome">← 回图谱</el-button>
        <span v-if="state.user" style="font-size:13px">👤 {{ state.nickname || state.user }}
          <el-tag v-if="state.role==='admin'" size="small" type="success">管理员</el-tag>
        </span>
        <el-button v-if="state.user" size="small" @click="logout">退出</el-button>
      </div>
    </div>

    <div class="upload-cols">
      <section class="upload-main">
        <el-alert type="info" :closable="false" show-icon style="margin-bottom:12px"
          title="发一个文章链接、或直接粘贴大段文本——AI 会自动拆解成知识点（生成检索标签、找好关联、建议归入哪个专栏），管理员审核通过后进入知识图谱。💬 助手用来提问解答，这里用来贡献知识。"></el-alert>

        <el-tabs v-model="mode" type="border-card">
          <el-tab-pane label="🔗 发链接" name="url">
            <el-form label-position="top">
              <el-form-item label="文章链接（知乎/博客/文档都行，抓不到时会提示你改贴正文）" required>
                <el-input v-model="urlForm.url" placeholder="https://zhuanlan.zhihu.com/p/xxxxx"></el-input>
              </el-form-item>
              <el-form-item label="备注（可选，给审核人看）">
                <el-input v-model="urlForm.note" maxlength="200" placeholder="如：这篇讲 Swarm Agent，我觉得值得收"></el-input>
              </el-form-item>
              <el-button type="primary" :loading="submitting" @click="submitUrl"
                title="提交后 AI 自动抓正文、提取扩写成知识点并生成检索标签">🚀 提交并让 AI 拆解</el-button>
            </el-form>
          </el-tab-pane>
          <el-tab-pane label="📝 贴文本" name="text">
            <el-form label-position="top">
              <el-form-item label="标题" required>
                <el-input v-model="textForm.title" maxlength="100" placeholder="如：Swarm Agent 学习笔记"></el-input>
              </el-form-item>
              <el-form-item label="正文（至少 200 字，AI 只做格式化整理，不添油加醋）" required>
                <el-input v-model="textForm.text" type="textarea" :rows="10" placeholder="把你的学习笔记或收藏的长文粘贴到这里…"></el-input>
              </el-form-item>
              <el-form-item label="备注（可选）">
                <el-input v-model="textForm.note" maxlength="200"></el-input>
              </el-form-item>
              <el-button type="primary" :loading="submitting" @click="submitText"
                title="提交后 AI 自动格式化、拆解成知识点并生成检索标签">🚀 提交并让 AI 整理</el-button>
            </el-form>
          </el-tab-pane>
        </el-tabs>

        <el-divider content-position="left">我的上传</el-divider>
        <el-empty v-if="!uploads.length" description="还没有上传过。发一个链接或贴一段文本试试。" :image-size="70"></el-empty>
        <div v-for="u in uploads" :key="u.id" class="up-card">
          <div class="up-head">
            <span style="font-size:13px;word-break:break-all;max-width:60%">
              <template v-if="u.kind === 'url'">{{ u.url }}</template>
              <template v-else>📝《{{ u.title }}》</template>
            </span>
            <el-tag :type="statusType(u.status)" size="small">{{ statusText(u.status) }}</el-tag>
            <span style="color:#999;font-size:12px;margin-left:auto">{{ shortTime(u.createdAt) }}</span>
          </div>
          <div v-if="u.note" style="color:#909399;font-size:12px;margin-top:4px">备注：{{ u.note }}</div>
          <el-alert v-if="u.status === 'extract_failed' && u.errorMsg" type="error" :closable="false"
            :title="u.errorMsg" style="margin-top:6px"></el-alert>
          <el-alert v-if="u.status === 'rejected' && u.rejectReason" type="error" :closable="false"
            :title="'驳回理由：' + u.rejectReason + '（' + (u.decidedBy || '') + '）'" style="margin-top:6px"></el-alert>
          <div v-if="u.status === 'extracted' && u.collectionSuggestion" style="color:#909399;font-size:12px;margin-top:4px">
            专栏建议：{{ u.collectionSuggestion.mode === 'merge' ? '并入已有专栏' : '新建专栏' }}
            <template v-if="u.collectionSuggestion.mode === 'new' && u.collectionSuggestion.title">《{{ u.collectionSuggestion.title }}》</template>
          </div>
          <div v-if="u.items && u.items.length" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
            <el-tag v-for="it in u.items" :key="it.id" size="small" type="info">{{ it.title }}</el-tag>
          </div>
        </div>
      </section>

      <aside class="upload-side">
        <el-card shadow="never">
          <template #header><b>我的贡献（近 90 天）</b></template>
          <el-skeleton v-if="contribLoading" :rows="2" animated></el-skeleton>
          <template v-else>
            <el-statistic :value="contrib.total" title="累计贡献分"></el-statistic>
            <div style="color:#909399;font-size:12.5px;margin:6px 0 4px">
              近 90 天活跃 {{ activeDays }} 天<template v-if="kindLine"> · {{ kindLine }}</template>
            </div>
            <div class="hm-grid">
              <div v-for="(col, ci) in heatCols" :key="ci" class="hm-col">
                <div v-for="c in col" :key="c.key" class="hm-cell" :class="'lv' + c.lv"
                     :title="c.key + '：' + c.points + ' 分'"></div>
              </div>
            </div>
            <div style="color:#c0c4cc;font-size:12px;margin-top:8px">上传入库 +8/篇 · 沉淀通过 +5 · 注释通过 +2（排行榜规划中）</div>
          </template>
        </el-card>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.1/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.1/dist/locale/zh-cn.min.js"></script>
  <script src="js/ep-common.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
